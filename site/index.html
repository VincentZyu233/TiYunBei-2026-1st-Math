<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>2026 年第一届“提云杯”线上联考 · 数学参考解答 (纯矢量超清展台)</title>
  <meta name="description" content="2026 年第一届提云杯数学参考解答及全套 333 DPI 纯矢量 SVG 在线交互展台，支持无限平滑缩放、单题聚焦与全卷连续阅读。">
  <link rel="icon" type="image/png" href="assets/avatars/tier.png">
  <link rel="apple-touch-icon" href="assets/avatars/tier.png">
  <!-- 霞鹜文楷等宽 WebFont (在线 CDN 引入) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-mono-webfont@1.1.0/style.css">
  <style>
    /* ============================================================
       提尔 (sSwar) 主题色彩体系 · 搭配 Typst / Python 语言点缀色
       ============================================================ */
    :root {
      /* 提尔头像主色调: 软雾薰衣草紫、可可暖棕与心形浅粉 */
      --primary: #7d6688;
      --primary-hover: #685273;
      --primary-active: #564260;
      --primary-light: #f3eff7;
      --primary-subtle: #faf7fc;
      --primary-glow: rgba(125, 102, 136, 0.16);

      --accent-pink: #df91a7;
      --accent-pink-light: #fdf2f5;
      --cocoa: #7d6260;

      /* 技术语言官方点缀色 (Typst 青绿 / Python 蓝黄) */
      --typst: #239dad;
      --typst-hover: #1c8292;
      --typst-light: #e6f6f8;
      --python: #3572a5;
      --python-hover: #295d88;
      --python-light: #ebf3fa;
      --python-yellow: #d97706;

      /* 背景与面板 */
      --bg: #f6f4f8;
      --panel: #ffffff;
      --panel-border: #e6e0ec;
      --text: #201a26;
      --text-muted: #6f6678;
      --text-soft: #988e9f;

      --shadow-sm: 0 1px 2px 0 rgba(125, 102, 136, 0.06);
      --shadow-md: 0 4px 10px -2px rgba(125, 102, 136, 0.12), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 14px 28px -6px rgba(125, 102, 136, 0.18), 0 4px 10px -3px rgba(0, 0, 0, 0.06);
      --font-sans: "LXGW WenKai Mono", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    [data-theme="dark"] {
      /* 深色模式: 提尔暗夜薰衣草紫 */
      --primary: #af97be;
      --primary-hover: #c4aed4;
      --primary-active: #d6c3e6;
      --primary-light: #282033;
      --primary-subtle: #1f1828;
      --primary-glow: rgba(175, 151, 190, 0.22);

      --accent-pink: #f2a7bc;
      --accent-pink-light: #331f28;
      --cocoa: #b39b97;

      --typst: #38c8dc;
      --typst-hover: #5edbf0;
      --typst-light: #152d33;
      --python: #58a6ff;
      --python-hover: #79b8ff;
      --python-light: #16263b;

      --bg: #120e17;
      --panel: #1b1523;
      --panel-border: #2c2239;
      --text: #f7f3fa;
      --text-muted: #a397ad;
      --text-soft: #7a7085;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.6);
      --shadow-md: 0 4px 10px -2px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 14px 28px -6px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 顶栏 ---- */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 30;
      flex-shrink: 0;
      box-shadow: 0 2px 8px -2px var(--primary-glow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    /* 双头像组 (提尔 × VincentZyu) */
    .avatar-pair {
      display: flex;
      align-items: center;
      position: relative;
      padding-right: 8px;
    }
    .avatar-bubble {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--panel);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.2s;
      cursor: pointer;
    }
    .avatar-bubble:hover {
      transform: scale(1.15) translateY(-2px);
      z-index: 10;
    }
    .avatar-tier {
      border-color: var(--primary);
      z-index: 2;
    }
    .avatar-zyu {
      margin-left: -14px;
      border-color: var(--accent-pink);
      z-index: 1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: -0.015em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.45rem;
      border-radius: 9999px;
      font-size: 0.68rem;
      font-weight: 650;
      line-height: 1.3;
      user-select: none;
    }
    .badge-tier {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--panel-border);
    }
    .badge-zyu {
      background: var(--accent-pink-light);
      color: var(--accent-pink);
      border: 1px solid rgba(223, 145, 167, 0.35);
    }
    .badge-author {
      gap: 0.32rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }
    .badge-author:hover {
      transform: translateY(-1.5px) scale(1.02);
      box-shadow: 0 3px 8px var(--primary-glow);
    }
    .badge-author:active {
      transform: translateY(0) scale(0.97);
    }
    .role-tag {
      font-size: 0.62rem;
      font-weight: 600;
      opacity: 0.85;
      padding: 0.05rem 0.25rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
    }
    [data-theme="dark"] .role-tag {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Toast 轻提示 */
    .toast-container {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .toast-bubble {
      background: rgba(32, 26, 38, 0.94);
      color: #ffffff;
      padding: 9px 20px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 650;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: toastAnim 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.22s, transform 0.22s;
    }
    [data-theme="dark"] .toast-bubble {
      background: rgba(247, 243, 250, 0.96);
      color: #1b1523;
      border-color: rgba(0, 0, 0, 0.15);
    }
    @keyframes toastAnim {
      from { opacity: 0; transform: translateY(-12px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .badge-typst {
      background: var(--typst-light);
      color: var(--typst);
      border: 1px solid rgba(35, 157, 173, 0.25);
    }
    .badge-link {
      text-decoration: none;
      cursor: pointer;
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .badge-link:hover {
      transform: translateY(-1.5px) scale(1.02);
      box-shadow: 0 3px 8px rgba(35, 157, 173, 0.25);
      border-color: var(--typst);
    }
    .badge-link:active {
      transform: translateY(0) scale(0.97);
    }
    .badge-python {
      background: var(--python-light);
      color: var(--python);
      border: 1px solid rgba(53, 114, 165, 0.25);
    }
    .badge-vector {
      background: var(--accent-pink-light);
      color: var(--accent-pink);
      border: 1px solid rgba(223, 145, 167, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.42rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      transition: all 0.16s ease;
      text-decoration: none;
      user-select: none;
    }
    .btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .btn-typst {
      border-color: rgba(35, 157, 173, 0.4);
      color: var(--typst);
    }
    .btn-typst:hover {
      background: var(--typst-light);
      border-color: var(--typst);
      color: var(--typst);
    }
    .btn-python {
      border-color: rgba(53, 114, 165, 0.4);
      color: var(--python);
    }
    .btn-python:hover {
      background: var(--python-light);
      border-color: var(--python);
      color: var(--python);
    }
    .btn-icon {
      padding: 0.42rem;
      width: 34px;
      height: 34px;
      font-size: 15px;
    }

    /* ---- 主容器布局 ---- */
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 62px);
      overflow: hidden;
      position: relative;
    }

    /* ---- 左侧题号导航侧栏 ---- */
    aside {
      width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
      transition: transform 0.25s ease;
    }
    .aside-header {
      padding: 0.9rem 1.1rem 0.65rem;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary-subtle);
    }
    .aside-title {
      font-size: 0.84rem;
      font-weight: 750;
      color: var(--primary);
      letter-spacing: 0.03em;
    }
    .view-toggle {
      display: flex;
      background: var(--panel);
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
    }
    .view-toggle-btn {
      padding: 0.24rem 0.52rem;
      border-radius: 4px;
      font-size: 0.73rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .view-toggle-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 4px var(--primary-glow);
    }
    .nav-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem;
    }
    .aside-footer {
      padding: 0.65rem 0.85rem;
      border-top: 1px solid var(--panel-border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .aside-repo-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.76rem;
      font-weight: 650;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.16s ease;
    }
    .aside-repo-link:hover {
      color: var(--primary);
    }
    .nav-chap-group {
      margin-bottom: 1.15rem;
      background: var(--primary-subtle);
      border-radius: 10px;
      padding: 0.55rem 0.6rem 0.75rem;
      border: 1px solid var(--panel-border);
    }
    .nav-chap-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .nav-chap-download {
      font-size: 0.72rem;
      color: var(--typst);
      background: var(--typst-light);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid rgba(35, 157, 173, 0.2);
      transition: all 0.15s ease;
    }
    .nav-chap-download:hover {
      background: var(--typst);
      color: white;
    }
    .q-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
    }
    .q-item {
      padding: 0.55rem 0.2rem;
      text-align: center;
      border-radius: 7px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
    }
    .q-item:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-1px);
    }
    .q-item.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px var(--primary-glow);
    }
    .q-item.special {
      grid-column: span 4;
      font-size: 0.78rem;
      padding: 0.5rem 0.7rem;
      text-align: left;
      border-left: 3px solid var(--accent-pink);
      background: var(--panel);
    }
    .q-item.special.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      border-left-color: var(--accent-pink);
    }

    /* ---- 展台视口 (Panzoom 核心) ---- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background-image: radial-gradient(var(--panel-border) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .viewport:active {
      cursor: grabbing;
    }
    .panzoom-layer {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .paper-card {
      background: #ffffff;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(125, 102, 136, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin: 0;
      transition: box-shadow 0.2s ease;
      display: inline-block;
    }
    .paper-card svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 连续滚动视图 */
    .continuous-scroll-view {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 2.2rem 1.5rem;
      width: 100%;
    }
    .continuous-scroll-view.active {
      display: block;
    }
    .continuous-container {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }
    .scroll-card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--panel-border);
      position: relative;
    }
    .scroll-card svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .scroll-card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(125, 102, 136, 0.88);
      color: white;
      backdrop-filter: blur(6px);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* ---- 浮动控制工具条 (Floating HUD) ---- */
    .hud-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-lg);
      z-index: 25;
      user-select: none;
    }
    [data-theme="dark"] .hud-controls {
      background: rgba(27, 21, 35, 0.92);
    }
    .hud-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }
    .hud-zoom-val {
      font-size: 0.82rem;
      font-weight: 750;
      min-width: 52px;
      text-align: center;
      color: var(--primary);
      cursor: pointer;
      padding: 0 4px;
    }
    .hud-divider {
      width: 1px;
      height: 18px;
      background: var(--panel-border);
    }

    /* 底部上一题/下一题悬浮条 */
    .nav-bar-bottom {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      padding: 5px 14px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 25;
    }
    [data-theme="dark"] .nav-bar-bottom {
      background: rgba(27, 21, 35, 0.92);
    }
    .nav-info {
      font-size: 0.86rem;
      font-weight: 750;
      white-space: nowrap;
      color: var(--primary);
    }

    .mobile-menu-btn { display: none; }

    @media (max-width: 840px) {
      .mobile-menu-btn { display: inline-flex; }
      aside {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
      }
      aside.open {
        transform: translateX(0);
      }
      .brand-title { font-size: 0.95rem; }
      .badge-sub { display: none; }
      .hud-controls { bottom: 16px; right: 16px; }
      .nav-bar-bottom { bottom: 76px; }
    }

    /* ---- 版本徽章与 Lean 样式 ---- */
    .badge-version {
      background: linear-gradient(135deg, #7d6688 0%, #df91a7 100%);
      color: #ffffff !important;
      font-size: 0.72rem;
      font-weight: 750;
      padding: 0.12rem 0.5rem;
      border-radius: 9999px;
      letter-spacing: 0.03em;
      box-shadow: 0 2px 6px rgba(125, 102, 136, 0.25);
    }
    .btn-lean {
      background: linear-gradient(135deg, rgba(108, 52, 131, 0.12) 0%, rgba(223, 145, 167, 0.15) 100%);
      border-color: rgba(108, 52, 131, 0.45);
      color: #6c3483;
      font-weight: 700;
    }
    .btn-lean:hover {
      background: linear-gradient(135deg, #6c3483 0%, #8e44ad 100%);
      color: #ffffff;
      border-color: #6c3483;
      box-shadow: 0 3px 10px rgba(108, 52, 131, 0.3);
    }
    [data-theme="dark"] .btn-lean {
      background: rgba(175, 151, 190, 0.18);
      border-color: #af97be;
      color: #dfcbe8;
    }
    [data-theme="dark"] .btn-lean:hover {
      background: #af97be;
      color: #1b1523;
    }

    /* ---- 侧栏双模式切换 Tabs ---- */
    .aside-tab-bar {
      display: flex;
      background: var(--bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 6px 8px;
      gap: 6px;
    }
    .aside-tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }
    .aside-tab-btn:hover {
      color: var(--text);
      background: var(--panel);
    }
    .aside-tab-btn.active {
      background: var(--panel);
      color: var(--primary);
      border-color: var(--panel-border);
      box-shadow: var(--shadow-sm);
    }
    [data-theme="dark"] .aside-tab-btn.active {
      color: #dfcbe8;
    }

    .lean-nav-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lean-nav-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 14px;

        </div>
      </div>
    </main>
  </div>

  <script>
    // ============================================================
    //  现代纯原生 Panzoom 缩放平移引擎
    // ============================================================
    class PanzoomEngine {
      constructor(viewportEl, layerEl, onChange) {
        this.viewport = viewportEl;
        this.layer = layerEl;
        this.onChange = onChange;

        this.scale = 1.0;
        this.minScale = 0.2;
        this.maxScale = 25.0; // 支持高达 2500% 极速无损放大
        this.x = 0;
        this.y = 0;

        this.isDragging = false;
        this.startX = 0;
        this.startY = 0;

        this.initEvents();
      }

      applyTransform() {
        this.layer.style.transform = `translate(${this.x}px, ${this.y}px) scale(${this.scale})`;
        if (this.onChange) this.onChange(this.scale);
      }

      zoomAt(factor, clientX, clientY) {
        const rect = this.viewport.getBoundingClientRect();
        const pivotX = clientX - rect.left;
        const pivotY = clientY - rect.top;

        const newScale = Math.min(Math.max(this.scale * factor, this.minScale), this.maxScale);
        if (newScale === this.scale) return;

        const ratio = newScale / this.scale;
        this.x = pivotX - (pivotX - this.x) * ratio;
        this.y = pivotY - (pivotY - this.y) * ratio;
        this.scale = newScale;

        this.applyTransform();
      }

      reset(targetScale = 1.0) {
        const vpRect = this.viewport.getBoundingClientRect();
        const card = this.layer.firstElementChild;
        if (!card) return;

        const cardW = card.offsetWidth || 800;
        const cardH = card.offsetHeight || 600;

        this.scale = targetScale;
        const availableX = vpRect.width - cardW * this.scale;
        // 纸张左上角靠左对齐 (左移更多)，顶部轻量留白 12px (上移)
        this.x = availableX > 32 ? Math.min(24, Math.max(16, availableX * 0.12)) : 16;
        this.y = 12;

        this.applyTransform();
      }

      fitWidth() {
        const vpRect = this.viewport.getBoundingClientRect();
        const card = this.layer.firstElementChild;
        if (!card) return;

        const cardW = card.offsetWidth || 800;
        const padding = 48;
        const targetScale = Math.min(Math.max((vpRect.width - padding) / cardW, 0.4), 2.8);

        this.scale = targetScale;
        const availableX = vpRect.width - cardW * this.scale;
        // 纸张左上角靠左对齐 (左移更多)，顶部轻量留白 12px (上移)，大小不变
        this.x = availableX > 32 ? Math.min(24, Math.max(16, availableX * 0.12)) : 16;
        this.y = 12;
        this.applyTransform();
      }

      initEvents() {
        // 滚轮平滑缩放
        this.viewport.addEventListener("wheel", (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
          this.zoomAt(zoomFactor, e.clientX, e.clientY);
        }, { passive: false });

        // 鼠标拖拽平移
        this.viewport.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          this.isDragging = true;
          this.startX = e.clientX - this.x;
          this.startY = e.clientY - this.y;
        });

        window.addEventListener("mousemove", (e) => {
          if (!this.isDragging) return;
          this.x = e.clientX - this.startX;
          this.y = e.clientY - this.startY;
          this.applyTransform();
        });

        window.addEventListener("mouseup", () => {
          this.isDragging = false;
        });

        // 双击放大/复位
        this.viewport.addEventListener("dblclick", (e) => {
          if (this.scale > 1.8) {
            this.fitWidth();
          } else {
            this.zoomAt(1.8, e.clientX, e.clientY);
          }
        });

        // 移动端双指手势缩放 (Pinch-to-zoom)
        let initialDistance = 0;
        let initialScale = 1.0;
        let initialCenterX = 0;
        let initialCenterY = 0;

        this.viewport.addEventListener("touchstart", (e) => {
          if (e.touches.length === 1) {
            this.isDragging = true;
            this.startX = e.touches[0].clientX - this.x;
            this.startY = e.touches[0].clientY - this.y;
          } else if (e.touches.length === 2) {
            this.isDragging = false;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialDistance = Math.hypot(dx, dy);
            initialScale = this.scale;
            initialCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            initialCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          }
        }, { passive: false });

        this.viewport.addEventListener("touchmove", (e) => {
          if (e.touches.length === 1 && this.isDragging) {
            e.preventDefault();
            this.x = e.touches[0].clientX - this.startX;
            this.y = e.touches[0].clientY - this.startY;
            this.applyTransform();
          } else if (e.touches.length === 2 && initialDistance > 0) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const currentDist = Math.hypot(dx, dy);
            const factor = currentDist / initialDistance;
            const targetScale = Math.min(Math.max(initialScale * factor, this.minScale), this.maxScale);

            const ratio = targetScale / this.scale;
            const rect = this.viewport.getBoundingClientRect();
            const pivotX = initialCenterX - rect.left;
            const pivotY = initialCenterY - rect.top;

            this.x = pivotX - (pivotX - this.x) * ratio;
            this.y = pivotY - (pivotY - this.y) * ratio;
            this.scale = targetScale;
            this.applyTransform();
          }
        }, { passive: false });

        this.viewport.addEventListener("touchend", () => {
          this.isDragging = false;
          initialDistance = 0;
        });
      }
    }

    // ============================================================
    //  应用状态与业务逻辑
    // ============================================================
    const state = {
      viewMode: "svg", // "svg" | "lean"
      manifest: null,
      currentQuestionId: "q01",
      allQuestions: [],
      mode: "single",
      svgCache: new Map(),

      // Lean 4 单步调试展台状态
      lean: {
        manifest: null,
        currentQno: "q08",
        currentData: null,
        currentStep: 0,
        isPlaying: false,
        timer: null,
        speed: 1200,
      }
    };

    let pz = null;

    async function init() {
      try {
        const [svgRes, leanRes] = await Promise.all([
          fetch("manifest.json").then(r => r.json()),
          fetch("lean/manifest.json").then(r => r.json()).catch(() => null)
        ]);

        state.manifest = svgRes;
        state.lean.manifest = leanRes;
        
        state.allQuestions = [];
        state.manifest.chapters.forEach(ch => {
          ch.questions.forEach(q => {
            state.allQuestions.push({ ...q, chapterId: ch.id, chapterTitle: ch.title });
          });
        });

        renderNav();
        renderLeanNav();
        setupEvents();

        // 占位符兜底容错（若本地静态打开未走 CI 替换，保证本地展示平滑）
        const badge = document.getElementById("badgeVersion");
        if (badge && badge.textContent.includes("__APP_VERSION__")) {
          const fallbackVer = (state.lean && state.lean.manifest && state.lean.manifest.version && !state.lean.manifest.version.includes("__APP_VERSION__"))
            ? state.lean.manifest.version
            : "0.2.0";
          badge.textContent = `v${fallbackVer}`;
          const zipBtn = document.getElementById("btnDownloadZip");
          if (zipBtn && zipBtn.href.includes("__APP_VERSION__")) {
            zipBtn.href = `https://github.com/VincentZyu233/TiYunBei-2026-1st-Math/releases/tag/v${fallbackVer}`;
            zipBtn.title = `下载全套 333 DPI 离线压缩包 (v${fallbackVer})`;
          }
        }

        await loadQuestion(state.allQuestions[0].id);

        pz = new PanzoomEngine(
          document.getElementById("viewport"),
          document.getElementById("panzoomLayer"),
          (scale) => {
            document.getElementById("zoomVal").textContent = Math.round(scale * 100) + "%";
          }
        );

        setTimeout(() => pz.fitWidth(), 100);

      } catch (err) {
        console.error("加载清单失败:", err);
      }
    }

    function renderNav() {
      const container = document.getElementById("navContainer");
      container.innerHTML = "";

      state.manifest.chapters.forEach(ch => {
        const group = document.createElement("div");
        group.className = "nav-chap-group";

        const header = document.createElement("div");
        header.className = "nav-chap-title";
        header.innerHTML = `
          <span>${ch.label}</span>
          <a class="nav-chap-download" href="${ch.pdf}" target="_blank" title="下载该章节 PDF">PDF ↗</a>
        `;
        group.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "q-grid";

        ch.questions.forEach(q => {
          const btn = document.createElement("button");
          const isSpecial = q.id.includes("bonus");
          btn.className = `q-item ${isSpecial ? "special" : ""}`;
          btn.dataset.qid = q.id;
          btn.textContent = isSpecial ? "💡 探究思考题" : q.id.replace("q", "");
          btn.title = q.title;

          btn.addEventListener("click", () => {
            if (state.viewMode !== "svg") {
              switchViewMode("svg");
            }
            if (state.mode === "single") {
              loadQuestion(q.id).then(() => {
                pz.fitWidth();
              });
            } else {
              const targetCard = document.getElementById(`scroll-${q.id}`);
              if (targetCard) targetCard.scrollIntoView({ behavior: "smooth" });
            }
            document.getElementById("asideNav").classList.remove("open");
          });

          grid.appendChild(btn);
        });

        group.appendChild(grid);
        container.appendChild(group);
      });
    }

    // ---- Lean 4 题目导航渲染 ----
    function renderLeanNav() {
      const container = document.getElementById("leanNavContainer");
      container.innerHTML = "";
      if (!state.lean.manifest || !state.lean.manifest.items) return;

      state.lean.manifest.items.forEach(item => {
        const el = document.createElement("div");
        el.className = `lean-nav-item ${item.qno === state.lean.currentQno ? "active" : ""}`;
        el.dataset.qno = item.qno;
        el.innerHTML = `
          <div class="lean-nav-top">
            <span class="lean-nav-no">第 ${item.displayNo} 题</span>
            <span class="lean-nav-type">${item.type}</span>
          </div>
          <div class="lean-nav-title">${item.title}</div>
          <div class="lean-nav-desc">${item.desc}</div>
        `;
        el.addEventListener("click", () => {
          loadLeanQuestion(item.qno);
          document.getElementById("asideNav").classList.remove("open");
        });
        container.appendChild(el);
      });
    }

    // ---- 加载单题 Lean 4 数据 ----
    async function loadLeanQuestion(qno) {
      state.lean.currentQno = qno;
      leanPause();

      document.querySelectorAll(".lean-nav-item").forEach(el => {
        el.classList.toggle("active", el.dataset.qno === qno);
      });

      try {
        const res = await fetch(`lean/${qno}.json`);
        const data = await res.json();
        state.lean.currentData = data;
        state.lean.currentStep = 0;

        document.getElementById("leanQTitle").textContent = data.title;
        document.getElementById("leanQDesc").textContent = data.problemSummary || "";
        document.getElementById("leanFileName").textContent = `Q${data.displayNo}.lean`;

        // 初始化代码视窗
        renderLeanCode(data.codeLines, data.steps[0].line);
        // 渲染第 0 步
        renderLeanStep(0);

        // 配置拖动滑块最大范围
        const slider = document.getElementById("dbgSlider");
        slider.min = 0;
        slider.max = data.steps.length - 1;
        slider.value = 0;

      } catch (err) {
        console.error(`加载 Lean 数据 ${qno} 失败:`, err);
      }
    }

    // ---- Lean 4 语法高亮轻量解析器 ----
    function highlightLeanCode(raw) {
      if (!raw) return "&nbsp;";
      let s = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      if (s.trim().startsWith("--")) {
        return `<span class="token-comment">${s}</span>`;
      }
      const kwRegex = /\b(import|open|scoped|variable|theorem|def|lemma|have|calc|rw|ring|ring_nf|linarith|nlinarith|norm_num|exact|intro|by|sorry|constructor|rcases|by_contra|push_neg|at)\b/g;
      s = s.replace(kwRegex, '<span class="token-kw">$1</span>');
      const typeRegex = /(ℝ|ℂ|ℕ|Type\*|I|StrictMono|Set\.Ioo|Set\.Ico|Real|Complex|Nat)/g;
      s = s.replace(typeRegex, '<span class="token-type">$1</span>');
      const symRegex = /(:=|⊢|⟪|⟫_ℝ|‖|‖²|\^|\+|≤|≥|↔|∧|∨|∀|∃|→|⟹)/g;
      s = s.replace(symRegex, '<span class="token-sym">$1</span>');
      return s;
    }

    // ---- 渲染代码视窗 ----
    function renderLeanCode(codeLines, activeLine) {
      const container = document.getElementById("leanCodeContainer");
      container.innerHTML = "";

      codeLines.forEach((line, idx) => {
        const lineNo = idx + 1;
        const lineEl = document.createElement("div");
        lineEl.className = `lean-code-line ${lineNo === activeLine ? "active" : ""}`;
        lineEl.id = `lean-line-${lineNo}`;
        lineEl.innerHTML = `
          <div class="lean-line-no">${lineNo}</div>
          <div class="lean-line-cursor">▶</div>
          <div class="lean-line-text">${highlightLeanCode(line)}</div>
        `;

        // 点击行跳转至匹配该行的步骤
        lineEl.addEventListener("click", () => {
          if (!state.lean.currentData) return;
          const matchIdx = state.lean.currentData.steps.findIndex(s => s.line === lineNo);
          if (matchIdx !== -1) {
            renderLeanStep(matchIdx);
          } else {
            // 找最近的步骤
            let closest = 0;
            let minDist = 999;
            state.lean.currentData.steps.forEach((s, sIdx) => {
              const dist = Math.abs(s.line - lineNo);
              if (dist < minDist) {
                minDist = dist;
                closest = sIdx;
              }
            });
            renderLeanStep(closest);
          }
        });

        container.appendChild(lineEl);
      });
    }

    // ---- 渲染证明状态 (Tactic State) ----
    function renderLeanStep(stepIndex) {
      if (!state.lean.currentData) return;
      const data = state.lean.currentData;
      const steps = data.steps;
      if (stepIndex < 0 || stepIndex >= steps.length) return;

      state.lean.currentStep = stepIndex;
      const step = steps[stepIndex];

      // 高亮代码行并居中滚动
      document.querySelectorAll(".lean-code-line").forEach(el => el.classList.remove("active"));
      const activeLineEl = document.getElementById(`lean-line-${step.line}`);
      if (activeLineEl) {
        activeLineEl.classList.add("active");
        activeLineEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      // 更新步骤条与滑块
      document.getElementById("dbgSlider").value = stepIndex;
      document.getElementById("dbgStepText").textContent = `步骤 ${stepIndex + 1} / ${steps.length}`;

      // 更新状态标签
      const statusTag = document.getElementById("leanStatusIndicator");
      if (step.isFinished) {
        statusTag.textContent = "已证毕 (Q.E.D.) 🎉";
        statusTag.classList.add("finished");
      } else {
        statusTag.textContent = "推演中 Running...";
        statusTag.classList.remove("finished");
      }

      // 渲染 Tactic 状态面板
      const stateBody = document.getElementById("leanStateBody");
      stateBody.innerHTML = "";

      // 1. 待证明目标 (Goals)
      if (step.goals && step.goals.length > 0) {
        const goalCard = document.createElement("div");
        goalCard.className = "lean-sec-card";
        goalCard.innerHTML = `
          <div class="lean-sec-header"><span>🎯</span> 待证明目标 (Goal)</div>
          ${step.goals.map(g => `<div class="lean-goal-item">${g.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`).join("")}
        `;
        stateBody.appendChild(goalCard);
      }

      // 2. 假设上下文 (Hypotheses)
      if (step.hypotheses && step.hypotheses.length > 0) {
        const hypCard = document.createElement("div");
        hypCard.className = "lean-sec-card";
        hypCard.innerHTML = `
          <div class="lean-sec-header"><span>📚</span> 当前作用域假设 (Hypotheses)</div>
          <div class="lean-hyp-list">
            ${step.hypotheses.map(h => `<div class="lean-hyp-item">${h.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`).join("")}
          </div>
        `;
        stateBody.appendChild(hypCard);
      }

      // 3. 证明闭合庆祝横幅
      if (step.isFinished) {
        const qedBanner = document.createElement("div");
        qedBanner.className = "lean-qed-banner";
        qedBanner.innerHTML = `
          <span>🎉</span>
          <span>Goals accomplished! 证明圆满闭合 · Q.E.D.</span>
        `;
        stateBody.appendChild(qedBanner);
      }

      // 4. 直观数学解析
      if (step.insight) {
        const insightBox = document.createElement("div");
        insightBox.className = "lean-insight-box";
        insightBox.innerHTML = `
          <div style="font-weight: 750; color: var(--primary); margin-bottom: 4px;">💡 数学直观剖析</div>
          <div>${step.insight}</div>
        `;
        stateBody.appendChild(insightBox);
      }
    }

    // ---- 播放与单步控制 ----
    function leanNext() {
      if (!state.lean.currentData) return;
      const total = state.lean.currentData.steps.length;
      if (state.lean.currentStep < total - 1) {
        renderLeanStep(state.lean.currentStep + 1);
      } else {
        leanPause();
      }
    }

    function leanPrev() {
      if (!state.lean.currentData) return;
      if (state.lean.currentStep > 0) {
        renderLeanStep(state.lean.currentStep - 1);
      }
    }

    function leanReset() {
      leanPause();
      renderLeanStep(0);
    }

    function leanPlay() {
      if (state.lean.isPlaying) return;
      state.lean.isPlaying = true;
      const playBtn = document.getElementById("btnDbgPlay");
      playBtn.textContent = "⏸ 暂停播放";
      playBtn.classList.add("playing");

      if (state.lean.currentData && state.lean.currentStep >= state.lean.currentData.steps.length - 1) {
        renderLeanStep(0);
      }

      state.lean.timer = setInterval(() => {
        if (!state.lean.currentData) return;
        const total = state.lean.currentData.steps.length;
        if (state.lean.currentStep < total - 1) {
          leanNext();
        } else {
          leanPause();
        }
      }, state.lean.speed);
    }

    function leanPause() {
      state.lean.isPlaying = false;
      const playBtn = document.getElementById("btnDbgPlay");
      if (playBtn) {
        playBtn.textContent = "▶ 自动播放";
        playBtn.classList.remove("playing");
      }
      if (state.lean.timer) {
        clearInterval(state.lean.timer);
        state.lean.timer = null;
      }
    }

    // ---- 视图模式切换 (SVG 题卡 vs Lean 4 定理推演) ----
    function switchViewMode(targetMode) {
      state.viewMode = targetMode;

      const tabSvg = document.getElementById("tabModeSvg");
      const tabLean = document.getElementById("tabModeLean");
      const svgNavHeader = document.getElementById("svgNavHeader");
      const navContainer = document.getElementById("navContainer");
      const leanNavContainer = document.getElementById("leanNavContainer");

      const viewport = document.getElementById("viewport");
      const continuousView = document.getElementById("continuousScrollView");
      const bottomNav = document.getElementById("bottomNav");
      const hudControls = document.getElementById("hudControls");
      const leanView = document.getElementById("leanSnapshotView");

      if (targetMode === "lean") {
        tabSvg.classList.remove("active");
        tabLean.classList.add("active");
        svgNavHeader.style.display = "none";
        navContainer.style.display = "none";
        leanNavContainer.style.display = "flex";

        viewport.style.display = "none";
        continuousView.style.display = "none";
        bottomNav.style.display = "none";
        hudControls.style.display = "none";
        leanView.style.display = "flex";

        if (!state.lean.currentData) {
          loadLeanQuestion(state.lean.currentQno || "q08");
        }
      } else {
        tabLean.classList.remove("active");
        tabSvg.classList.add("active");
        svgNavHeader.style.display = "flex";
        navContainer.style.display = "block";
        leanNavContainer.style.display = "none";

        leanView.style.display = "none";
        leanPause();

        if (state.mode === "single") {
          viewport.style.display = "flex";
          continuousView.style.display = "none";
          bottomNav.style.display = "flex";
          hudControls.style.display = "flex";
          if (pz) pz.fitWidth();
        } else {
          viewport.style.display = "none";
          continuousView.style.display = "block";
          bottomNav.style.display = "none";
          hudControls.style.display = "none";
        }
      }
    }

    async function loadQuestion(qid) {
      const q = state.allQuestions.find(item => item.id === qid);
      if (!q) return;

      state.currentQuestionId = qid;
      document.getElementById("currentQTitle").textContent = q.title;
      document.getElementById("btnDownloadSvg").href = q.svg;
      document.getElementById("btnDownloadSvg").download = `提云杯-2026-${qid}.svg`;

      document.querySelectorAll(".q-item").forEach(el => {
        el.classList.toggle("active", el.dataset.qid === qid);
      });

      const paperCard = document.getElementById("paperCard");

      if (state.svgCache.has(q.svg)) {
        paperCard.innerHTML = state.svgCache.get(q.svg);
      } else {
        const svgRes = await fetch(q.svg);
        const svgText = await svgRes.text();
        state.svgCache.set(q.svg, svgText);
        paperCard.innerHTML = svgText;
      }
    }

    async function loadContinuousView() {
      const container = document.getElementById("continuousContainer");
      if (container.children.length > 0) return;

      for (const q of state.allQuestions) {
        const card = document.createElement("div");
        card.className = "scroll-card";
        card.id = `scroll-${q.id}`;

        const badge = document.createElement("div");
        badge.className = "scroll-card-badge";
        badge.textContent = q.title;
        card.appendChild(badge);

        const svgRes = await fetch(q.svg);
        const svgText = await svgRes.text();
        const wrapper = document.createElement("div");
        wrapper.innerHTML = svgText;
        card.appendChild(wrapper);

        container.appendChild(card);
      }
    }

    function setupEvents() {
      // 缩放控制
      document.getElementById("btnZoomIn").addEventListener("click", () => {
        const rect = document.getElementById("viewport").getBoundingClientRect();
        pz.zoomAt(1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
      document.getElementById("btnZoomOut").addEventListener("click", () => {
        const rect = document.getElementById("viewport").getBoundingClientRect();
        pz.zoomAt(0.8, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
      document.getElementById("btnFitWidth").addEventListener("click", () => pz.fitWidth());
      document.getElementById("btnResetZoom").addEventListener("click", () => pz.fitWidth());
      document.getElementById("zoomVal").addEventListener("click", () => pz.reset(1.0));

      function stepQuestion(delta) {
        const idx = state.allQuestions.findIndex(q => q.id === state.currentQuestionId);
        if (idx === -1) return;
        const nextIdx = idx + delta;
        if (nextIdx >= 0 && nextIdx < state.allQuestions.length) {
          loadQuestion(state.allQuestions[nextIdx].id).then(() => pz.fitWidth());
        }
      }

      document.getElementById("btnPrevQ").addEventListener("click", () => stepQuestion(-1));
      document.getElementById("btnNextQ").addEventListener("click", () => stepQuestion(1));

      // 键盘全局快捷键
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;

        if (state.viewMode === "lean") {
          if (e.key === " " || e.code === "Space") {
            e.preventDefault();
            if (state.lean.isPlaying) leanPause(); else leanPlay();
          } else if (e.key === "ArrowRight" || e.key === "]" || e.key === "d" || e.key === "D") {
            e.preventDefault();
            leanNext();
          } else if (e.key === "ArrowLeft" || e.key === "[" || e.key === "a" || e.key === "A") {
            e.preventDefault();
            leanPrev();
          } else if (e.key === "r" || e.key === "R") {
            e.preventDefault();
            leanReset();
          } else if (e.key === "Escape") {
            switchViewMode("svg");
          }
          return;
        }

        // SVG 模式快捷键
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          stepQuestion(-1);
        } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          stepQuestion(1);
        } else if (e.key === "+" || e.key === "=") {
          const rect = document.getElementById("viewport").getBoundingClientRect();
          pz.zoomAt(1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
        } else if (e.key === "-") {
          const rect = document.getElementById("viewport").getBoundingClientRect();
          pz.zoomAt(0.8, rect.left + rect.width / 2, rect.top + rect.height / 2);
        } else if (e.key === "0") {
          pz.fitWidth();
        }
      });

      // SVG 单题 vs 连续切换
      const btnModeSingle = document.getElementById("btnModeSingle");
      const btnModeContinuous = document.getElementById("btnModeContinuous");
      const viewport = document.getElementById("viewport");
      const continuousView = document.getElementById("continuousScrollView");
      const bottomNav = document.getElementById("bottomNav");
      const hudControls = document.getElementById("hudControls");

      btnModeSingle.addEventListener("click", () => {
        btnModeSingle.classList.add("active");
        btnModeContinuous.classList.remove("active");
        viewport.style.display = "flex";
        continuousView.classList.remove("active");
        bottomNav.style.display = "flex";
        hudControls.style.display = "flex";
        state.mode = "single";
      });

      btnModeContinuous.addEventListener("click", async () => {
        btnModeContinuous.classList.add("active");
        btnModeSingle.classList.remove("active");
        viewport.style.display = "none";
        continuousView.classList.add("active");
        bottomNav.style.display = "none";
        hudControls.style.display = "none";
        state.mode = "continuous";
        await loadContinuousView();
      });

      // 侧栏模式切换 (SVG 题卡 vs Lean 4)
      document.getElementById("tabModeSvg").addEventListener("click", () => switchViewMode("svg"));
      document.getElementById("tabModeLean").addEventListener("click", () => switchViewMode("lean"));
      document.getElementById("btnBackToSvg").addEventListener("click", () => switchViewMode("svg"));

      // Lean 调试播放器控制器按钮
      document.getElementById("btnDbgReset").addEventListener("click", leanReset);
      document.getElementById("btnDbgPrev").addEventListener("click", leanPrev);
      document.getElementById("btnDbgNext").addEventListener("click", leanNext);
      document.getElementById("btnDbgPlay").addEventListener("click", () => {
        if (state.lean.isPlaying) leanPause(); else leanPlay();
      });

      const dbgSlider = document.getElementById("dbgSlider");
      dbgSlider.addEventListener("input", (e) => {
        leanPause();
        renderLeanStep(parseInt(e.target.value, 10));
      });

      const dbgSpeedSelect = document.getElementById("dbgSpeedSelect");
      dbgSpeedSelect.addEventListener("change", (e) => {
        state.lean.speed = parseInt(e.target.value, 10);
        if (state.lean.isPlaying) {
          leanPause();
          leanPlay();
        }
      });

      document.getElementById("btnFullscreen").addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      const btnTheme = document.getElementById("btnToggleTheme");
      btnTheme.addEventListener("click", () => {
        const isDark = document.body.getAttribute("data-theme") === "dark";
        document.body.setAttribute("data-theme", isDark ? "light" : "dark");
        localStorage.setItem("theme", isDark ? "light" : "dark");
      });

      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) {
        document.body.setAttribute("data-theme", savedTheme);
      } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.setAttribute("data-theme", "dark");
      }

      document.getElementById("btnToggleAside").addEventListener("click", () => {
        document.getElementById("asideNav").classList.toggle("open");
      });

      // ---- 复制 QQ 与 Toast 轻提示 ----
      function showToast(msg) {
        let container = document.getElementById("toastContainer");
        if (!container) {
          container = document.createElement("div");
          container.id = "toastContainer";
          container.className = "toast-container";
          document.body.appendChild(container);
        }
        const bubble = document.createElement("div");
        bubble.className = "toast-bubble";
        bubble.innerHTML = `<span>📋</span> ${msg}`;
        container.appendChild(bubble);

        setTimeout(() => {
          bubble.style.opacity = "0";
          bubble.style.transform = "translateY(-10px)";
          setTimeout(() => bubble.remove(), 250);
        }, 2200);
      }

      function copyQQ(qq, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(qq).then(() => {
            showToast(`已复制 ${label} QQ: ${qq}`);
          }).catch(() => fallbackCopy(qq, label));
        } else {
          fallbackCopy(qq, label);
        }
      }

      function fallbackCopy(qq, label) {
        const ta = document.createElement("textarea");
        ta.value = qq;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast(`已复制 ${label} QQ: ${qq}`);
        } catch (e) {
          prompt(`请手动复制 ${label} QQ:`, qq);
        }
        document.body.removeChild(ta);
      }

      ["avatarTier", "badgeTier"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener("click", () => copyQQ("1210183458", "出题人 提尔"));
      });

      ["avatarZyu", "badgeZyu"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener("click", () => copyQQ("1830540513", "写题人 VincentZyu"));
      });
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
